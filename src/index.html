<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>UML Syncboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">

    <!-- HEADER -->
    <header class="app-header glass">
      <div class="header-left">
        <div class="app-title-block">
          <span class="app-logo">⌘</span>
          <div>
            <div class="app-name">UML Syncboard</div>
            <div class="app-subtitle">
              <span id="diagramNameLabel"></span>
              <span class="dot-sep">•</span>
              <span id="diagramTypeLabel"></span>
              <span class="dot-sep">•</span>
              <span id="versionLabel"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="header-center">
        <button class="btn ghost" id="newDiagramBtn">New Diagram</button>
        <button class="btn ghost" id="recentWorkspacesBtn">Recent</button>
        <button class="btn ghost" id="reviewModeToggle">Review Mode</button>
        <button class="btn ghost" id="quickSearchBtn">Search (Ctrl+F)</button>
      </div>

      <div class="header-right">
        <button class="btn" id="exportSnapshotBtn">Export JSON (Ctrl+S)</button>
        <button class="btn" id="importSnapshotBtn">Import JSON</button>
        <button class="btn" id="exportPlantUMLBtn">Copy PlantUML</button>
        <button class="btn ghost" id="exportSVGBtn">Export SVG</button>
        <button class="btn ghost" id="exportPNGBtn">Export PNG</button>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <main class="app-main">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar-left glass">
        <h2 class="sidebar-title">Palette</h2>

        <div class="tool-group">
          <div class="tool-group-title">Tools</div>
          <button class="tool-btn active" data-tool="select">Select / Move</button>
          <button class="tool-btn" data-tool="pan">Pan</button>
          <button class="tool-btn" data-tool="zoom">Zoom</button>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">Elements</div>
          <button class="tool-btn" data-tool="add-class">Add Class</button>
          <button class="tool-btn" data-tool="add-interface">Add Interface</button>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">Connections</div>
          <button class="tool-btn" data-tool="assoc">Association</button>
          <button class="tool-btn" data-tool="inheritance">Inheritance</button>
          <button class="tool-btn" data-tool="realization">Realization</button>
          <button class="tool-btn" data-tool="dependency">Dependency</button>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">Review</div>
          <button class="tool-btn" data-tool="add-comment">Add Comment</button>

          <div class="filter-row">
            <label class="label-small">Severity</label>
            <select id="reviewSeverityFilter" class="input small">
              <option value="all">All</option>
              <option value="info">Info</option>
              <option value="warn">Warn</option>
              <option value="blocker">Blocker</option>
            </select>
          </div>
        </div>

        <div class="tool-group">
          <div class="tool-group-title">Zoom</div>
          <input type="range" id="zoomSlider" min="30" max="200" value="100" />
          <div class="zoom-label"><span id="zoomValue">100%</span></div>
        </div>
      </aside>

      <!-- CANVAS -->
      <section class="canvas-wrapper">
        <div class="canvas-inner glass">
          <svg id="diagramCanvas" class="diagram-canvas">
            <defs>
              <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
              </pattern>
            </defs>

            <rect x="0" y="0" width="4000" height="4000" fill="url(#gridPattern)" />

            <g id="connectionsLayer"></g>
            <g id="elementsLayer"></g>
            <g id="commentsLayer"></g>
          </svg>
        </div>
      </section>

      <!-- RIGHT SIDEBAR -->
      <aside class="sidebar-right glass">

        <div class="inspector-section">
          <h2 class="sidebar-title">Inspector</h2>
          <div id="inspectorContent" class="inspector-content empty">
            <p>No selection</p>
          </div>
        </div>

        <div class="inspector-section">
          <h2 class="sidebar-title">Comments</h2>
          <div id="commentsList" class="comments-list"></div>
        </div>

        <div class="inspector-section">
          <h2 class="sidebar-title">Decision Log</h2>
          <form id="decisionForm" class="decision-form">
            <input type="text" class="input" id="decisionTitle" placeholder="Decision title" />
            <textarea class="input" id="decisionReason" rows="2" placeholder="Reason / context"></textarea>
            <button type="submit" class="btn small">Add Decision</button>
          </form>
          <ul id="decisionLog" class="decision-log"></ul>
        </div>

      </aside>
    </main>

    <!-- BOTTOM PANELS -->
    <section class="bottom-panels">

      <div class="panel glass">
        <div class="panel-header">
          <h3>Activity Log</h3>
        </div>
        <ul id="activityLog" class="log-list"></ul>
      </div>

      <div class="panel glass">
        <div class="panel-header">
          <h3>Diff & Merge</h3>
          <div class="panel-actions">
            <button class="btn small" id="buildDiffBtn">Build Diff</button>
            <button class="btn small" id="applyAllDiffBtn">Apply All</button>
          </div>
        </div>
        <ul id="diffList" class="log-list"></ul>
      </div>

      <div class="panel glass">
        <div class="panel-header">
          <h3>Workspace</h3>
        </div>

        <div class="workspace-box">
          <div class="workspace-row">
            <label class="label-small">Workspace name</label>
            <input type="text" id="workspaceNameInput" class="input small" />
          </div>

          <div class="workspace-row">
            <label class="label-small">Recent workspaces</label>
            <ul id="recentWorkspacesList" class="recent-list"></ul>
          </div>
        </div>
      </div>

    </section>

  </div>

  <!-- MODAL -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal glass">
      <header class="modal-header">
        <h2 id="modalTitle"></h2>
        <button id="modalCloseBtn" class="modal-close">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFooter" class="modal-footer"></footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
